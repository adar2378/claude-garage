#:schema https://raw.githubusercontent.com/adar2378/claude-garage/main/schemas/garage-plugin.schema.json
id          = "tile-buttons"
name        = "Tile buttons"
version     = "0.1.0"
api_version = 1
platforms   = ["macos", "linux", "windows"]
description = "A close button in every tile title bar"
permissions = ["core.actions"]

# No commands: each button triggers a core action. Both are dangerous, so the
# wall arms them on the first click and runs them on the second.
#
# x closes the session; it stays in the rail as a grey row and can be restored.
# del forgets it: the session is killed and no closed record is kept, so there
# is no way back (the arm prompt says so).
[[buttons]]
slot     = "tile.title.right"
label    = " x "
tooltip  = "Close this session (click again to confirm)"
on_click = "session.close"
confirm  = true
priority = 5

[[buttons]]
slot     = "tile.title.right"
label    = " del "
tooltip  = "Delete this session: kills it and keeps no history (click again to confirm)"
on_click = "session.delete"
confirm  = true
priority = 4
