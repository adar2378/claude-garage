[package]
name = "garage-plugin-alerts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage bundled plugin: a chime and a desktop banner when a session needs you or finishes"
publish = false

# Not a release artifact of its own: shipped inside the claude-garage archive.
[package.metadata.dist]
dist = false

[[bin]]
name = "alerts"
path = "src/main.rs"

[lib]
name = "alerts"
path = "src/lib.rs"

[dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
