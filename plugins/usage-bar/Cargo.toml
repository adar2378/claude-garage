[package]
name = "garage-plugin-usage-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage bundled plugin: 5-hour and weekly usage in the status strip"
publish = false

[[bin]]
name = "usage-bar"
path = "src/main.rs"

[lib]
name = "usage_bar"
path = "src/lib.rs"

[dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
