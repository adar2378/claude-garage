[package]
name = "garage-plugin-cli-extras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage bundled plugin: claude-garage <folder>, install and prune"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cli-extras"
path = "src/main.rs"

[dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde_json = "1"

[dev-dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk", features = ["testing"] }
tempfile = "3"
