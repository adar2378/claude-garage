[package]
name = "garage-plugin-jump-palette"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage bundled plugin: / opens a fuzzy palette to jump to any session or project"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "jump-palette"
path = "src/main.rs"

[dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk", features = ["tui"] }

[dev-dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk", features = ["tui", "testing"] }
