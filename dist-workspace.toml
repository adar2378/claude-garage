[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Regenerate .github/workflows/release.yml with
# `dist generate` after editing; `dist plan` checks the two agree.
[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "powershell", "npm", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Build the first-party plugins into the binary (crates/daemon/build.rs).
features = ["bundle-plugins"]
install-path = "~/.local/bin"
# TODO(user): create github.com/adar2378/homebrew-tap and give this repo a
# HOMEBREW_TAP_TOKEN secret that can push to it.
tap = "adar2378/homebrew-tap"
publish-jobs = ["homebrew", "./publish-npm"]
# Runs before anything is built or published.
plan-jobs = ["./release-tests"]
install-success-msg = "claude-garage installed. Run `claude-garage` (needs tmux and the claude CLI on PATH)."

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
