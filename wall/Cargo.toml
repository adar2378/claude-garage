# garage-wall — the claude-garage TUI, ported to ratatui (p9-ratatui-port).
#
# Member of the root cargo workspace (p21-rust-daemon). Crate pins follow the
# ratatui spike (spikes/ratatui-wall/SPIKE.md): published crates only, no git
# deps, no vendoring.

[package]
name = "garage-wall"
version.workspace = true
edition.workspace = true

[features]
default = ["pet"]
# The pit pet (spec tui-pit-pet). Off: the wall builds and runs without it.
pet = []

[lib]
name = "garage_wall"
path = "src/lib.rs"

[[bin]]
name = "garage-wall"
path = "src/main.rs"

[[bin]]
# Test helper for the teardown-injection regression test (tests/injection.rs):
# attaches TileClients to scratch tmux sessions and either closes them
# cleanly or holds them for the test to SIGKILL. Not shipped.
name = "pty_hold"
path = "src/bin/pty_hold.rs"

[dependencies]
garage-protocol = { path = "../crates/protocol" }
garage-host = { path = "../crates/host" }
# TUI stack — pinned per the spike (all gates passed on these exact crates).
ratatui = "0.30.2"
crossterm = "0.29.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
tui-term = "0.3.4"

# Runtime shape (design.md: tokio; PTY readers + SSE as tasks feeding one
# event channel; a single state-owning loop).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

# Daemon HTTP client (design.md: "std TCP or a small HTTP crate") — ureq,
# blocking, run inside spawn_blocking tasks. No TLS: the daemon is
# 127.0.0.1-only plain HTTP.
ureq = { version = "2.12.1", default-features = false }
serde_json = "1.0"

# Motion (p23, spec tui-motion). All three sit behind ui/motion.rs.
tachyonfx = { version = "=0.25.2", default-features = false, features = ["std"] }
throbber-widgets-tui = "=0.11.1"
tui-big-text = "=0.8.10"

# Startup hand-off liveness check (kill(pid, 0)); unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"
