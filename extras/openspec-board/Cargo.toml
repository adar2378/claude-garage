[package]
name = "garage-plugin-openspec-board"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "claude-garage plugin: a read-only overlay of the OpenSpec changes of a workspace"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "openspec-board"
path = "src/main.rs"

# Inside the claude-garage repository the SDK is a path dependency (see
# examples/openspec-progress). In your own repository use a tagged release:
#   garage-plugin-sdk = { git = "https://github.com/adar2378/claude-garage", tag = "v1.1.2" }
[dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk" }
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
garage-plugin-sdk = { path = "../../crates/plugin-sdk", features = ["testing"] }
tempfile = "3"

# Not part of the garage workspace: this folder builds on its own.
[workspace]
