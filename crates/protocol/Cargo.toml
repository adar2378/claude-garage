[package]
name = "garage-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wire types and JSON schema for the claude-garage daemon and plugin HTTP API"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["claude", "claude-code", "protocol", "schema"]
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
sha2 = "0.11"
getrandom = "0.4"
schemars = "1"
