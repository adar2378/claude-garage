[package]
name = "garage-plugin"
version.workspace = true
edition.workspace = true
description = "claude-garage plugin contract: manifest types, validation, JSON schema"

[dependencies]
garage-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"
schemars = "0.8"
semver = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.30", default-features = false }
