[package]
name = "garage-plugin"
version.workspace = true
edition.workspace = true
description = "claude-garage plugin contract: manifest types, validation, JSON schema"

[dependencies]
garage-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the generated schema file must not depend on which other
# crate in the build turns this feature on.
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
toml = "1"
schemars = "1"
semver = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.60", default-features = false }
