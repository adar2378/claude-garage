[package]
name = "claude-garage"
version = "0.1.0"
edition = "2021"
description = "claude-garage: one binary for the TUI, the daemon and the launcher"

[[bin]]
name = "claude-garage"
path = "src/main.rs"

[dependencies]
garage-daemon = { path = "../daemon" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
