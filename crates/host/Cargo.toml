[package]
name = "garage-host"
version.workspace = true
edition = "2021"
description = "claude-garage session host: one detached process per session (ConPTY/PTY + vt100 + loopback socket), the Windows backend"

[dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
