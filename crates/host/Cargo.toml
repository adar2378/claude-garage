[package]
name = "garage-host"
version.workspace = true
edition.workspace = true
description = "claude-garage session host: one detached process per session (ConPTY/PTY + vt100 + loopback socket), the Windows backend"

[dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
