[package]
name = "garage-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage plugin helper: read the run context, call the daemon with the plugin token, push widgets"

[features]
# Raw-mode terminal toolkit for pane plugins (fuzzy picker, one-line prompt).
tui = ["dep:crossterm"]
# A fake daemon (a local HTTP server that records requests) for plugin tests.
testing = []

[dependencies]
crossterm = { version = "0.29", optional = true }
garage-protocol = { path = "../protocol" }
serde_json = "1"
ureq = { version = "3", default-features = false }
