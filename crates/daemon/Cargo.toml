[package]
name = "garage-daemon"
version.workspace = true
edition = "2021"
description = "claude-garage daemon: HTTP API over tmux-owned Claude Code sessions"

[dependencies]
garage-protocol = { path = "../protocol" }
garage-host = { path = "../host" }
anyhow = "1"
libc = "0.2"
getrandom = "0.3"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gethostname = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "time", "fs", "io-util"] }

[features]
# Exposes `test_support` (TestTmux) to other crates' tests.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
