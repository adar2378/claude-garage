[package]
name = "garage-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "claude-garage daemon: HTTP API over tmux-owned Claude Code sessions"

[dependencies]
garage-protocol = { path = "../protocol" }
garage-plugin = { path = "../plugin" }
garage-host = { path = "../host" }
anyhow = "1"
libc = "0.2"
getrandom = "0.4"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gethostname = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "time", "fs", "io-util"] }

[build-dependencies]
sha2 = "0.11"

[features]
# Exposes `test_support` (TestTmux) to other crates' tests.
test-support = []
# Release builds: build the first-party plugins (nested cargo run) and embed
# them, with their SHA-256, so every installer ships them and the daemon can
# check them before each start (build.rs, plugins::bundled).
embed-plugins = []

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
