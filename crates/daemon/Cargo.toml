[package]
name = "garage-daemon"
version.workspace = true
edition = "2021"
description = "claude-garage daemon: HTTP API over tmux-owned Claude Code sessions"

[dependencies]
garage-protocol = { path = "../protocol" }
anyhow = "1"
getrandom = "0.3"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gethostname = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "time", "fs", "io-util"] }

[features]
# Exposes `test_support` (TestTmux) to other crates' tests.
test-support = []

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
