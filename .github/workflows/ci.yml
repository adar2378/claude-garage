# Tests on every pull request and every push to main.
#
# The release workflow only runs on tags and only on macOS; this one is the
# safety net before that. Windows is allowed to fail for now: the daemon and
# TUI assume tmux and a Unix shell, so that job shows the gap without blocking.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# a newer push to the same ref makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # rustup ships on GitHub's runners; no third-party action
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wall/target
            target
            tests/contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tests/contract/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      # --lib --bins: tests/injection.rs needs a tmux server
      - name: TUI tests
        working-directory: wall
        run: cargo test --lib --bins

      - name: TUI clippy
        working-directory: wall
        run: cargo clippy --all-targets -- -D warnings

      # some daemon tests start and kill their own scratch tmux sessions
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Daemon tests
        if: runner.os != 'Windows'
        run: npm test

      # HTTP-only API contract tests (tests/contract): start the daemon on a
      # private port and tmux socket, no Windows (needs tmux)
      - name: Contract tests
        if: runner.os != 'Windows'
        run: npm run test:contract

      # the same suite against the Rust daemon (p21): proves the swap
      - name: Contract tests (Rust daemon)
        if: runner.os != 'Windows'
        run: npm run test:contract:rust
